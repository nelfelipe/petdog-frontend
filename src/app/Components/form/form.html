<div class="formulario">
  <h2>Registrar producto - PetDog</h2>

  <mat-form-field appearance="outline">
    <mat-label>Código</mat-label>
    <input matInput [(ngModel)]="producto.codigo" placeholder="PET-011">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Nombre del producto</mat-label>
    <input matInput [(ngModel)]="producto.nombre" placeholder="Ej. Concentrado adulto 8 kg">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Categoría</mat-label>
    <mat-select [(ngModel)]="producto.categoria">
      <mat-option value="Alimento">Alimento</mat-option>
      <mat-option value="Snacks">Snacks</mat-option>
      <mat-option value="Juguetes">Juguetes</mat-option>
      <mat-option value="Higiene">Higiene</mat-option>
      <mat-option value="Accesorios">Accesorios</mat-option>
      <mat-option value="Salud">Salud</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Tamaño del perro</mat-label>
    <mat-select [(ngModel)]="producto.tamano">
      <mat-option value="Pequeño">Pequeño</mat-option>
      <mat-option value="Mediano">Mediano</mat-option>
      <mat-option value="Grande">Grande</mat-option>
      <mat-option value="Todos">Todos</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Precio</mat-label>
    <input matInput type="number" [(ngModel)]="producto.precio">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Stock</mat-label>
    <input matInput type="number" [(ngModel)]="producto.stock">
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="registrarProducto()">
    Registrar producto
  </button>
</div>
